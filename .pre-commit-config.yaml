repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20  # keep in step with the ruff resolved in uv.lock
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --unsafe-fixes]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0  # keep in step with the mypy resolved in uv.lock
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml, --explicit-package-bases]
        additional_dependencies:
          - nextcord==3.2.0
          - asyncpg==0.31.0
          - aiohttp==3.14.3
          - feedparser==6.0.12
          - beautifulsoup4==4.15.0
          - validators==0.35.0
          - python-dotenv==1.2.2
          - Pillow>=11.0.0
          - psutil>=5.9.0
          - pytest>=8.0.0

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run --extra dev pytest tests/ -x -q
        language: system
        pass_filenames: false
        always_run: true
