services:
  discord-bot:
    build: .
    image: veka-discord-bot:latest
    container_name: veka-discord-bot
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
    mem_limit: 768m
    networks:
      - veka-network

  # Dashboard API (src/api), reached through Traefik on proxy-network.
  api:
    build:
      context: .
      args:
        UV_EXTRAS: "--extra api"
    image: veka-api:latest
    container_name: veka-api
    restart: unless-stopped
    command: ["python", "-m", "src.api"]
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
    mem_limit: 512m
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy-network
      - traefik.http.routers.veka-api.rule=Host(`api.veka.gg`)
      - traefik.http.routers.veka-api.entrypoints=websecure
      - traefik.http.routers.veka-api.tls=true
      - traefik.http.routers.veka-api.tls.certresolver=letsencrypt
      - traefik.http.routers.veka-api.middlewares=secure-headers@file,internal-only@file
      # /v1/health is public for status.veka.gg; the rest of the API is internal-only.
      - traefik.http.routers.veka-api-health.rule=Host(`api.veka.gg`) && Path(`/v1/health`)
      - traefik.http.routers.veka-api-health.entrypoints=websecure
      - traefik.http.routers.veka-api-health.tls=true
      - traefik.http.routers.veka-api-health.tls.certresolver=letsencrypt
      - traefik.http.routers.veka-api-health.middlewares=secure-headers@file
      - traefik.http.services.veka-api.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - veka-network
      - proxy-network

networks:
  veka-network:
    driver: bridge
  proxy-network:
    external: true
