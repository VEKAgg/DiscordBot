services:
  discord-bot:
    build: .
    image: veka-discord-bot:latest
    container_name: veka-discord-bot
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      # DATABASE_URL is expected to be provided in the .env file
    networks:
      - veka-network

  # Dashboard API (src/api): a separate process that shares the database with the bot and never talks
  # to the Discord gateway. Published only on API_BIND_ADDRESS (default: this machine only); the reverse
  # proxy (Traefik) forwards https://<API host> to it. See docs/DASHBOARD_API_DEPLOY.md.
  api:
    build:
      context: .
      args:
        UV_EXTRAS: "--extra api"
    image: veka-api:latest
    container_name: veka-api
    restart: unless-stopped
    command: ["python", "-m", "src.api"]
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PUBLISHED_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - veka-network

networks:
  veka-network:
    driver: bridge
