name: Deploy service

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      revision:
        required: true
        type: string
      rollback:
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, Veka]
    timeout-minutes: 30
    # Private repositories on GitHub Free cannot use native Environments.
    # Logical environment/activation is enforced below and in the server entrypoint.
    concurrency:
      group: deploy-bot-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # Deliberately no checkout on the VM; reviewed tooling is installed from homelab-priv.
      - name: Verify environment is enabled
        env:
          STAGING_DEPLOY_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          PRODUCTION_AUTO_DEPLOY: ${{ vars.PRODUCTION_AUTO_DEPLOY }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/dev) enabled=$STAGING_DEPLOY_ENABLED ;;
            refs/heads/main) enabled=$PRODUCTION_DEPLOY_ENABLED ;;
            *) exit 1 ;;
          esac
          test "$enabled" = true || {
            echo "::error::Enable STAGING_DEPLOY_ENABLED or PRODUCTION_DEPLOY_ENABLED in repository variables only after bootstrap/cutover."
            exit 1
          }
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$PRODUCTION_AUTO_DEPLOY" != true ]; then
            echo "::error::Production is manual by default. Dispatch Release on main, or explicitly enable PRODUCTION_AUTO_DEPLOY."
            exit 1
          fi
          test -f /srv/stacks/veka-platform/bin/platform.py

      - name: Deploy and verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE: ${{ inputs.image }}
          REVISION: ${{ inputs.revision }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/veka-registry.XXXXXX")
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          case "$GITHUB_REF" in
            refs/heads/dev) target=staging ;;
            refs/heads/main) target=production ;;
            *) exit 1 ;;
          esac
          flags=()
          if [ "$ROLLBACK" = true ]; then flags+=(--rollback); fi
          python3 /srv/stacks/veka-platform/bin/platform.py "$target" deploy bot "$IMAGE" "$REVISION" "${flags[@]}"

      - name: Deployment result
        if: always()
        env:
          RESULT: ${{ job.status }}
          IMAGE: ${{ inputs.image }}
          REVISION: ${{ inputs.revision }}
        run: |
          printf '### bot deployment\n\nResult: %s\n\nBranch: `%s`\n\nCommit: `%s`\n\nImage: `%s`\n' \
            "$RESULT" "$GITHUB_REF_NAME" "$REVISION" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
