name: AGENTS.md reminder

# Advisory check: when a PR changes code without touching AGENTS.md, it adds a warning annotation
# and a job-summary note so the reviewer can decide whether the agent guide needs an update.
# It never fails the PR; not every code change needs a documentation change.

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: agents-md-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agents-md:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether AGENTS.md was updated alongside code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # HEAD is the PR's test merge commit, so this diff is exactly what the PR changes.
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          code=$(printf '%s\n' "$changed" | grep -vE \
            '(\.md$|^\.github/|^docs/|(^|/)(uv\.lock|poetry\.lock|package-lock\.json|pnpm-lock\.yaml)$|(^|/)\.(gitignore|editorconfig)$|^LICEN[CS]E$)' \
            || true)
          if [ -z "$code" ]; then
            echo "Only docs, workflow or lockfile changes."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qx 'AGENTS.md'; then
            echo "AGENTS.md updated alongside code."
            exit 0
          fi
          echo "::warning title=AGENTS.md not updated::This PR changes code but not AGENTS.md. Update it if commands, architecture, conventions or known issues changed."
          {
            echo "### AGENTS.md not updated"
            echo "Code files changed in this PR:"
            printf '%s\n' "$code" | sed 's/^/- `/; s/$/`/'
            echo
            echo "No action needed unless commands, architecture, conventions or known issues changed."
          } >> "$GITHUB_STEP_SUMMARY"
